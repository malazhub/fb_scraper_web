<body><main class="main onepage"><header class="top pagehead"><div><div class="eyebrow">SOCIAL PUBLISHING</div><h1>smpost</h1></div><div class="topTools"><button class="btn secondary smallbtn" onclick="backup()">Backup</button><label class="btn ghost smallbtn" for="import">Restore</label><input type="file" id="import" accept="application/json" hidden></div></header>
<section class="card destinationCard"><div class="sectiontitle"><h2>Destinations</h2><span class="pill"><span id="destinationCount">0</span> saved</span></div>
<div class="row searchrow"><div class="field grow"><label>Find Facebook public groups</label><input id="topic" placeholder="e.g. education"></div><div class="field countfield"><label>Results</label><select id="searchCount"><option>10</option><option>20</option><option>30</option><option>50</option><option>100</option></select></div><div class="field searchbtn"><label> </label><button class="btn primary" onclick="discover()">Search</button></div></div>
<div class="searchConnection"><span class="connectionDot" id="connectionDot"></span><span id="connectionStatus">Search service: checking connection…</span><button type="button" class="btn ghost smallbtn" onclick="checkSearchService()">Check connection</button></div><div class="row"><div class="field grow"><label for="searchBackendUrl">Search backend URL</label><input id="searchBackendUrl" type="url" placeholder="https://your-worker.your-subdomain.workers.dev" autocomplete="url"></div><div class="field searchbtn"><label> </label><button type="button" class="btn secondary" onclick="connectSearchBackend()">Connect backend</button></div></div>
<div id="searchMsg" class="small muted" aria-live="polite"></div><div id="searchResults" class="searchResults"></div><div class="line"></div><div class="sectiontitle compact"><h3>Your destinations</h3></div><div id="destList" class="list"></div><button class="btn secondary addChannel" onclick="toggleChannelForm()">＋ Add destination / channel</button>
<div id="channelForm" class="channelForm hidden"><div class="row"><div class="field"><label>Channel</label><select id="destPlatform"><option value="facebook">Facebook</option><option value="instagram">Instagram</option><option value="tiktok">TikTok</option><option value="telegram">Telegram</option><option value="x">X</option><option value="linkedin">LinkedIn</option><option value="youtube">YouTube</option><option value="pinterest">Pinterest</option><option value="other">Other</option></select></div><div class="field"><label>Type</label><select id="destType"><option value="group">Group</option><option value="page">Page</option><option value="channel">Channel</option><option value="profile">Profile</option><option value="community">Community</option><option value="other">Other</option></select></div></div><div class="row"><div class="field grow"><label>Name</label><input id="destName" placeholder="Destination name"></div><div class="field grow"><label>Link</label><input id="destUrl" placeholder="https://..."></div></div><div class="actions"><button class="btn primary" onclick="addDest()">Save destination</button><button class="btn ghost" onclick="toggleChannelForm()">Cancel</button><span id="destMsg" class="small muted"></span></div></div></section>
<section class="card"><div class="sectiontitle"><h2>Create post</h2></div><div class="field"><label>Post text</label><textarea id="caption" maxlength="10000" placeholder="Write your post..."></textarea><div class="small muted" id="charCount">0 / 10,000</div></div><div class="field"><label>Photos and videos</label><input id="files" type="file" accept="image/jpeg,image/png,image/gif,image/webp,video/mp4,video/quicktime,video/webm" multiple><div id="mediaPreview" class="media"></div></div></section>
<section class="card"><div class="sectiontitle"><h2>Schedule</h2></div><div class="row scheduleRow"><div class="field"><label>Publish date</label><input type="date" id="startDate"></div><div class="field"><label>Publish time</label><input type="time" id="publishTime" value="09:00"></div></div><div class="small muted">One post, one time, all selected destinations.</div><div class="actions scheduleActions"><button class="btn primary" onclick="savePlan()">Schedule post</button><button class="btn ghost" onclick="clearComposer()">Clear</button></div><div id="composeMsg" class="small muted" aria-live="polite"></div></section>
<section class="card queueCard"><div class="sectiontitle"><h2>Scheduled posts</h2><span class="pill"><span id="queueCount">0</span></span></div><div id="scheduleList" class="list"></div></section><footer class="foot">smpost</footer></main><script>
var KEY='smp_workspace_v1',DB='smp_media_v1',SEARCH_KEY='smp_search_api_v1',SEARCH_API=localStorage.getItem(SEARCH_KEY)||'',state={posts:[],destinations:[],labels:{}},mediaFiles=[],selectedDestinationIds=new Set(),searchResults=[];
function $(id){return document.getElementById(id)}function uid(){return self.crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}function names(p){return {facebook:'Facebook',instagram:'Instagram',tiktok:'TikTok',telegram:'Telegram',x:'X',linkedin:'LinkedIn',youtube:'YouTube',pinterest:'Pinterest',other:'Other'}[p]||p}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){alert('Browser storage is full. Export a backup and remove older plans.');return false}}
function load(){try{var s=JSON.parse(localStorage.getItem(KEY)||'{}');state.posts=Array.isArray(s.posts)?s.posts:[];state.destinations=Array.isArray(s.destinations)?s.destinations:[];state.labels=Object.assign(state.labels,s.labels||{})}catch(e){console.warn(e)}}
var dbPromise=null;function db(){if(dbPromise)return dbPromise;dbPromise=new Promise(function(resolve,reject){var r=indexedDB.open(DB,1);r.onupgradeneeded=function(){if(!r.result.objectStoreNames.contains('files'))r.result.createObjectStore('files',{keyPath:'id'})};r.onsuccess=function(){resolve(r.result)};r.onerror=function(){reject(r.error)}});return dbPromise}

function getFile(id){return db().then(function(d){return new Promise(function(resolve,reject){var r=d.transaction('files').objectStore('files').get(id);r.onsuccess=function(){resolve(r.result||null)};r.onerror=function(){reject(r.error)}})})}
function delFile(id){return db().then(function(d){return new Promise(function(resolve,reject){var t=d.transaction('files','readwrite');t.objectStore('files').delete(id);t.oncomplete=resolve;t.onerror=function(){reject(t.error)}})})}
function chosenPlatforms(){return Array.from(new Set(Array.from(selectedDestinationIds).map(function(id){var d=state.destinations.find(function(x){return x.id===id});return d&&d.platform}).filter(Boolean)))}
function dests(p){return state.destinations.filter(function(d){return d.platform===p})}
function toggleDestination(id,on){if(on)selectedDestinationIds.add(id);else selectedDestinationIds.delete(id)}
function renderPickers(){renderDests()}
function renderDests(){var box=$('destList');if(!box)return;if(!state.destinations.length){box.innerHTML='<div class="empty">No destinations saved yet.</div>';return}box.innerHTML=state.destinations.map(function(d){var checked=selectedDestinationIds.has(d.id);return '<label class="destrow"><input type="checkbox" '+(checked?'checked':'')+' onchange="toggleDestination(\''+d.id+'\',this.checked)"><span class="destname"><strong>'+esc(d.name)+'</strong><small>'+esc(d.type||'destination')+' · '+esc(d.url)+'</small></span><span class="networkBadge">'+esc(names(d.platform))+'</span><button type="button" class="btn danger smallbtn" onclick="event.preventDefault();removeDest(\''+d.id+'\')">×</button></label>'}).join('')}
function toggleChannelForm(){$('channelForm').classList.toggle('hidden')}
function renderSlots(){var box=$('scheduleList'),posts=state.posts||[];if(!box)return;$('queueCount').textContent=posts.length;box.innerHTML=posts.length?posts.map(function(p){var slot=(p.schedule||[])[0],when=slot?new Date(slot.when).toLocaleString():'Not scheduled',targets=(p.destinations||[]).map(function(id){var d=state.destinations.find(function(x){return x.id===id});return d?d.name:'Saved destination'}).join(', ');return '<div class="item"><div><strong>'+esc((p.caption||'Media post').slice(0,100))+'</strong><div class="meta">'+esc(when)+' · '+esc(targets)+'</div></div><div class="item-actions"><button class="btn danger smallbtn" onclick="deletePost(\''+p.id+'\')">Delete</button></div></div>'}).join(''):'<div class="empty">No scheduled posts yet.</div>'}
$('caption').addEventListener('input',function(){$('charCount').textContent=$('caption').value.length+' / 10,000'});
$('files').addEventListener('change',async function(e){var files=Array.from(e.target.files);if(files.length+mediaFiles.length>15){alert('Choose a maximum of 15 media files per post.');e.target.value='';return}for(var file of files){if(!/^(image\/(jpeg|png|gif|webp)|video\/(mp4|quicktime|webm))$/.test(file.type)){alert('Unsupported media: '+file.name);continue}if(file.size>150*1024*1024){alert('File exceeds 150 MB: '+file.name);continue}try{mediaFiles.push(await putFile(file))}catch(err){alert('Could not save file in browser storage: '+err.message)}}e.target.value='';await renderMedia()});
async function renderMedia(){var box=$('mediaPreview');box.innerHTML='';for(var f of mediaFiles){var data=await getFile(f.id),el=document.createElement('div');el.className='thumb';if(data){var src=URL.createObjectURL(data.blob),node=document.createElement(data.type.indexOf('video/')===0?'video':'img');node.src=src;if(node.tagName==='VIDEO')node.muted=true;el.appendChild(node)}var b=document.createElement('button');b.textContent='×';b.onclick=async function(id){await delFile(id);mediaFiles=mediaFiles.filter(function(x){return x.id!==id});renderMedia()} .bind(null,f.id);el.appendChild(b);box.appendChild(el)}}
function picked(p){return Array.from(selectedDestinationIds).filter(function(id){var d=state.destinations.find(function(x){return x.id===id});return d&&d.platform===p})}
function getSchedule(){var ids=Array.from(selectedDestinationIds),date=$('startDate').value,time=$('publishTime').value;if(!ids.length)throw Error('Select at least one destination.');if(!date||!time)throw Error('Choose a publishing date and time.');var dt=new Date(date+'T'+time+':00');if(isNaN(dt.getTime())||dt.getTime()<=Date.now())throw Error('Choose a future date and time.');return ids.map(function(id){var d=state.destinations.find(function(x){return x.id===id});return {id:uid(),platform:d.platform,destinationId:id,destinationName:d.name,when:dt.toISOString(),status:'planned'}})}
function savePlan(){try{var caption=$('caption').value.trim();if(!caption&&!mediaFiles.length)throw Error('Write your post or attach media.');var slots=getSchedule(),post={id:uid(),title:'Post',caption:caption,platforms:chosenPlatforms(),media:mediaFiles.slice(),destinations:Array.from(selectedDestinationIds),schedule:slots,createdAt:new Date().toISOString()};state.posts.unshift(post);if(!persist())return;mediaFiles=[];selectedDestinationIds.clear();$('caption').value='';$('charCount').textContent='0 / 10,000';$('mediaPreview').innerHTML='';$('files').value='';$('composeMsg').textContent='Schedule saved. Automatic publishing needs an authorized connection for each selected platform.';render()}catch(e){$('composeMsg').textContent=e.message}}
function clearComposer(){if(!confirm('Clear this post?'))return;mediaFiles.forEach(function(x){delFile(x.id)});mediaFiles=[];selectedDestinationIds.clear();$('caption').value='';$('charCount').textContent='0 / 10,000';$('mediaPreview').innerHTML='';$('files').value='';$('composeMsg').textContent='';render()}
function setConnection(ok,message){var dot=$('connectionDot');dot.classList.toggle('online',!!ok);$('connectionStatus').textContent=message}
function connectSearchBackend(){var value=$('searchBackendUrl').value.trim().replace(/\\/+$/,'');try{var parsed=new URL(value);if(parsed.protocol!=='https:')throw Error('Use an HTTPS backend URL.');SEARCH_API=parsed.origin;localStorage.setItem(SEARCH_KEY,SEARCH_API);checkSearchService()}catch(e){setConnection(false,e.message||'Enter a valid backend URL.')}}async function checkSearchService(){if(!SEARCH_API){$('searchBackendUrl').value='';setConnection(false,'Connect your search backend once to enable public search.');return false}$('searchBackendUrl').value=SEARCH_API;setConnection(false,'Checking configured search backend…');try{var response=await fetch(SEARCH_API+'/api/status',{method:'GET',headers:{Accept:'application/json'},cache:'no-store'});var data=await response.json();if(!response.ok)throw Error(data.error||'HTTP '+response.status);if(!data.search_configured)throw Error('Search provider is not configured.');setConnection(true,'Search backend connected.');return true}catch(e){setConnection(false,'Cannot reach the configured search backend: '+e.message);return false}}
async function discover(){var topic=$('topic').value.trim(),limit=$('searchCount').value;if(!topic){$('searchMsg').textContent='Enter a topic such as education.';return}if(!SEARCH_API){$('searchMsg').textContent='Connect your search backend above before searching.';return}$('searchMsg').textContent='Connecting and searching public listings…';$('searchResults').innerHTML='';try{var url=SEARCH_API+'/api/discover?'+new URLSearchParams({q:topic,platform:'facebook',type:'group',limit:limit});var response=await fetch(url,{headers:{Accept:'application/json'},cache:'no-store'}),data=await response.json();if(!response.ok){if(response.status===503){setConnection(false,'Search service needs its private Brave Search API key.');throw Error(data.error||'Search provider is not configured.')}if(response.status===502)throw Error((data.error||'Search provider error')+(data.detail?' Details: '+data.detail:''));throw Error(data.error||'HTTP '+response.status)}searchResults=data.results||[];renderSearchResults();setConnection(true,'Search service connected and configured.');$('searchMsg').textContent='Found '+searchResults.length+' public web results from '+(data.source||'the public web index')+'. Add the groups you want.';if(!searchResults.length)$('searchMsg').textContent='No matching public group links were found. Try a broader or alternate spelling.'}catch(e){if(e.name==='TypeError'){$('searchMsg').textContent='Cannot reach the search service. It may not be deployed, may be waking up, or may have a CORS configuration problem. Check the connection and try again in a minute.'}else{$('searchMsg').textContent='Search failed: '+e.message}}}
function renderSearchResults(){var box=$('searchResults');box.innerHTML=searchResults.map(function(r,i){var saved=state.destinations.some(function(d){return d.url===r.url});return '<div class="result"><div class="resultMain"><span class="resultTitle">'+esc(r.title)+'</span><div class="resultSnippet">'+esc(r.snippet||r.url)+'</div><a href="'+esc(r.url)+'" target="_blank" rel="noopener">View result</a></div><button class="btn secondary smallbtn" '+(saved?'disabled':'')+' onclick="saveSearchResult('+i+')">'+(saved?'Added':'＋ Add')+'</button></div>'}).join('')}
function saveSearchResult(i){var r=searchResults[i];if(!r||state.destinations.some(function(d){return d.url===r.url}))return;state.destinations.push({id:uid(),platform:'facebook',type:'group',name:r.title,url:r.url,area:'',notes:r.snippet||''});persist();render();renderSearchResults()}
function addDest(){var p=$('destPlatform').value,t=$('destType').value,n=$('destName').value.trim(),url=$('destUrl').value.trim();if(!n||!url){$('destMsg').textContent='Enter a name and link.';return}var u;try{u=new URL(url)}catch(e){$('destMsg').textContent='Enter a valid URL.';return}if(u.protocol!=='https:'){$('destMsg').textContent='Use an HTTPS link.';return}state.destinations.push({id:uid(),platform:p,type:t,name:n,url:u.href,area:'',notes:''});persist();$('destName').value='';$('destUrl').value='';$('destMsg').textContent='Saved.';render();$('channelForm').classList.add('hidden')}
function removeDest(id){state.destinations=state.destinations.filter(function(x){return x.id!==id});selectedDestinationIds.delete(id);persist();render()}
function slotsAll(){return state.posts.flatMap(function(p){return (p.schedule||[]).map(function(s){return Object.assign({},s,{postId:p.id,postTitle:p.title})})}).sort(function(a,b){return a.when.localeCompare(b.when)})}
function openDest(id){var d=state.destinations.find(function(x){return x.id===id});if(d)window.open(d.url,'_blank','noopener');else alert('Destination link is no longer saved.')}
function markDone(pid,sid){if(!confirm('Mark this action as completed manually? This does not verify that a platform accepted the post.'))return;var p=state.posts.find(function(x){return x.id===pid}),s=p&&p.schedule.find(function(x){return x.id===sid});if(s){s.status='done';s.completedAt=new Date().toISOString();persist();render()}}
function renderLibrary(){var box=$('libraryList');if(!state.posts.length){box.innerHTML='<div class="empty">No posts saved. Create your first content plan.</div>';return}box.innerHTML=state.posts.map(function(p){return '<div class="item"><div><strong>'+esc(p.title)+'</strong><div class="meta">'+esc((p.platforms||[]).map(names).join(', '))+' · '+(p.schedule||[]).length+' planned actions · '+(p.media||[]).length+' media files</div><div class="meta">'+esc((p.caption||'').slice(0,170))+'</div></div><div class="item-actions"><button class="btn secondary smallbtn" onclick="duplicatePost(\''+p.id+'\')">Duplicate</button><button class="btn danger smallbtn" onclick="deletePost(\''+p.id+'\')">Delete</button></div></div>'}).join('')}
function duplicatePost(id){var p=state.posts.find(function(x){return x.id===id});if(!p)return;var copy=JSON.parse(JSON.stringify(p));copy.id=uid();copy.title+=' (copy)';copy.createdAt=new Date().toISOString();copy.schedule=copy.schedule.map(function(s){return Object.assign({},s,{id:uid(),status:'planned',completedAt:null})});state.posts.unshift(copy);persist();render();alert('Plan copied. Review the dates before using it.')}
async function deletePost(id){if(!confirm('Delete this post plan and its associated media?'))return;var p=state.posts.find(function(x){return x.id===id});if(p)for(var m of (p.media||[]))await delFile(m.id);state.posts=state.posts.filter(function(x){return x.id!==id});persist();render()}
function renderHome(){var all=slotsAll(),future=all.filter(function(s){return s.status!=='done'&&new Date(s.when)>=new Date()}).slice(0,6);$('stPosts').textContent=state.posts.length;$('stSlots').textContent=all.filter(function(s){return s.status!=='done'}).length;$('stDest').textContent=state.destinations.length;$('stDone').textContent=all.filter(function(s){return s.status==='done'}).length;$('upcoming').innerHTML=future.length?future.map(function(s){return '<div class="item"><div><strong>'+esc(s.postTitle)+'</strong><div class="meta">'+esc(names(s.platform))+' · '+esc(s.destinationName)+' · '+esc(new Date(s.when).toLocaleString())+'</div></div><button class="btn ghost smallbtn" onclick="openDest(\''+s.destinationId+'\')">Open</button></div>'}).join(''):'<div class="empty">No upcoming actions. Create your first plan.</div>'}
function renderLabels(){$('accountLabels').innerHTML=['facebook','instagram','tiktok'].map(function(p){return '<div class="field"><label>'+names(p)+' label</label><input data-label="'+p+'" value="'+esc(state.labels[p]||'')+'" placeholder="Optional account name"></div>'}).join('')}
function saveLabels(){document.querySelectorAll('[data-label]').forEach(function(x){state.labels[x.dataset.label]=x.value.trim().slice(0,100)});persist();alert('Account labels saved on this device.')}
function render(){renderPickers();renderSlots();var d=$('destinationCount');if(d)d.textContent=state.destinations.length}
function exportCsv(){var slots=slotsAll();if(!slots.length){alert('No schedule items to export.');return}var rows=[['Post','Platform','Destination','Scheduled at','Status']].concat(slots.map(function(s){return [s.postTitle,names(s.platform),s.destinationName,new Date(s.when).toISOString(),s.status]}));var csv=rows.map(function(r){return r.map(function(v){return '"'+String(v||'').replace(/"/g,'""')+'"'}).join(',')}).join('\r\n');download('socialmediaposts-schedule.csv','text/csv;charset=utf-8',csv)}
function download(name,type,content){var blob=content instanceof Blob?content:new Blob([content],{type:type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(function(){URL.revokeObjectURL(url)},2500)}
function blobData(blob){return new Promise(function(resolve,reject){var r=new FileReader();r.onload=function(){resolve(r.result)};r.onerror=function(){reject(r.error)};r.readAsDataURL(blob)})}
function dataBlob(uri){var parts=uri.split(','),mime=(parts[0].match(/data:(.*?);base64/)||[])[1]||'application/octet-stream',raw=atob(parts[1]),arr=new Uint8Array(raw.length);for(var i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);return new Blob([arr],{type:mime})}
async function backup(){try{var b={format:'socialmediaposts-backup-v1',exportedAt:new Date().toISOString(),state:state,media:[]};for(var p of state.posts)for(var m of p.media||[]){if(b.media.some(function(x){return x.id===m.id}))continue;var f=await getFile(m.id);if(f)b.media.push({id:m.id,name:m.name,type:m.type,data:await blobData(f.blob)})}download('socialmediaposts-backup.json','application/json',JSON.stringify(b))}catch(e){alert('Backup failed: '+e.message)}}
$('import').addEventListener('change',async function(e){var f=e.target.files[0];if(!f)return;try{var b=JSON.parse(await f.text());if(b.format!=='socialmediaposts-backup-v1'||!b.state)throw Error('Invalid backup format.');if(!confirm('Replace this browser workspace with the selected backup?'))return;var map={};for(var m of b.media||[]){var blob=dataBlob(m.data),d=await db();await new Promise(function(resolve,reject){var tx=d.transaction('files','readwrite');tx.objectStore('files').put({id:m.id,name:m.name,type:m.type,blob:blob,size:blob.size});tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error)}});map[m.id]={id:m.id,name:m.name,type:m.type,size:blob.size}}state=b.state;state.posts=(state.posts||[]).map(function(p){p.media=(p.media||[]).map(function(m){return map[m.id]||m});return p});persist();render();alert('Backup imported.')}catch(err){alert('Import failed: '+err.message)}finally{e.target.value=''}})
async function erase(){if(!confirm('Delete all content, destinations and media from this browser? Export a backup first.'))return;localStorage.removeItem(KEY);var d=await db();await new Promise(function(resolve,reject){var tx=d.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=resolve;tx.onerror=function(){reject(tx.error)}});state={posts:[],destinations:[],labels:{facebook:'',instagram:'',tiktok:''}};render();alert('Local workspace erased.')}

load();$('startDate').value=today();render();checkSearchService();
if('serviceWorker'in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('./sw.js').catch(function(){})})}
</script></body></html>
