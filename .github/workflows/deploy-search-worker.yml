name: Deploy smpost search backend

on:
  push:
    branches: [main]
    paths:
      - "worker.mjs"
      - "wrangler.toml"
      - ".github/workflows/deploy-search-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check Cloudflare credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          if [[ -n "$CLOUDFLARE_API_TOKEN" && -n "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Explain one-time setup needed
        if: steps.credentials.outputs.ready != 'true'
        run: |
          {
            echo "## Search backend not deployed yet"
            echo
            echo "Add repository Actions secrets named CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID, then run this workflow again."
            echo "No Render service or Brave API key is used."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Deploy Worker
        id: deploy
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Show deployed backend URL
        if: steps.credentials.outputs.ready == 'true'
        env:
          WORKER_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          {
            echo "## Search backend deployed"
            echo
            echo "Backend URL: $WORKER_URL"
            echo
            echo "Paste this URL into the Search backend URL field in smpost."
          } >> "$GITHUB_STEP_SUMMARY"
