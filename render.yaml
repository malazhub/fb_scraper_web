services:
  - type: web
    name: smpost-search-api
    runtime: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 2 --timeout 120
    healthCheckPath: /api/me
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: BRAVE_SEARCH_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://riobase.github.io"
